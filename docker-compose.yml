# Chay toan bo 6 service + frontend trong Docker.
#
#   docker compose up -d --build      # bat tat ca (lan dau, co build)
#   docker compose up -d              # bat lai, khong build
#   docker compose ps                 # xem cai gi song/chet (thay dev-status.ps1)
#   docker compose logs -f chat       # xem log 1 service
#   docker compose up -d --build chat # build lai 1 service sau khi sua code
#   docker compose down               # tat tat ca
#
# HA TANG (Postgres/Redis/Kafka/RabbitMQ/LiveKit/MinIO) KHONG nam trong file
# nay - chung chay san trong cac cluster K8s (docker-desktop, kind-*) va
# MinIO tren may LAN rieng. Compose chi chay tang ung dung.
#
# Vi sao "host.docker.internal" o khap noi: ha tang publish cong ra Windows
# host, ma trong container "localhost" la chinh container do. Dia chi nay la
# duong duy nhat container goi nguoc ra host duoc.

name: chat-app

x-service: &service
  restart: unless-stopped
  networks: [app]
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 25s

# Bi mat KHONG con nam trong file nay (file nay duoc commit len GitHub cong
# khai). Gia tri that doc tu .env o thu muc goc - file do bi .gitignore chan.
# Chua co .env thi compose canh bao bien rong va service se chet luc khoi dong.
# Chep mau:  cp .env.example .env
x-redis: &redis "host.docker.internal:6379,password=${REDIS_PASSWORD}"
x-kafka: &kafka "host.docker.internal:9092"
x-jwt: &jwt "${JWT_SIGNING_KEY}"
# Ba gia tri nay truoc nam trong appsettings.json cua tung service. Da bo
# trong o do de commit duoc, nen bay gio PHAI cap qua env - thieu la
# service chet luc khoi dong.
x-rabbit-pw: &rabbitpw "${RABBITMQ_PASSWORD}"
x-minio-ak: &minioak "${MINIO_ACCESS_KEY}"
x-minio-sk: &miniosk "${MINIO_SECRET_KEY}"

services:
  identity:
    <<: *service
    build: ./IdentityService/src/IdentityService.Api
    ports: ["5194:8080"]
    environment:
      ConnectionStrings__IdentityDb: "Host=host.docker.internal;Port=5432;Database=identity;Username=identity_admin;Password=${IDENTITY_DB_PASSWORD}"
      Smtp__AppPassword: "${SMTP_APP_PASSWORD}"
      ConnectionStrings__Redis: *redis
      Kafka__BootstrapServers: *kafka
      RabbitMq__HostName: host.docker.internal
      Jwt__SigningKey: *jwt
      RabbitMq__Password: *rabbitpw

  workspace:
    <<: *service
    build: ./WorkspaceService/src/WorkspaceService.Api
    ports: ["5153:8080"]
    environment:
      ConnectionStrings__WorkspaceDb: "Host=host.docker.internal;Port=5433;Database=workspace;Username=workspace_admin;Password=${WORKSPACE_DB_PASSWORD}"
      ConnectionStrings__Redis: *redis
      RabbitMq__HostName: host.docker.internal
      Jwt__SigningKey: *jwt
      RabbitMq__Password: *rabbitpw
      # Goi lan nhau bang TEN SERVICE cua compose + cong noi bo 8080, khong
      # qua host - ngan hon va khong phu thuoc cong publish ra ngoai.
      IdentityClient__BaseUrl: http://identity:8080
      ChatServiceClient__BaseUrl: http://chat:8080

  chat:
    <<: *service
    build: ./ChatService/src/ChatService.Api
    ports: ["5261:8080"]
    environment:
      ConnectionStrings__ChatDb: "Host=host.docker.internal;Port=5434;Database=chat;Username=chat_admin;Password=${CHAT_DB_PASSWORD}"
      ConnectionStrings__Redis: *redis
      Kafka__BootstrapServers: *kafka
      RabbitMq__HostName: host.docker.internal
      Jwt__SigningKey: *jwt
      RabbitMq__Password: *rabbitpw
      WorkspaceClient__BaseUrl: http://workspace:8080
      MediaServiceClient__BaseUrl: http://media:8080
      IdentityClient__BaseUrl: http://identity:8080
      # KHONG doi sang host.docker.internal: URL presign nay tra thang cho
      # TRINH DUYET, nen phai la dia chi trinh duyet toi duoc. Chat Service
      # khong bao gio ket noi toi MinIO (presign la phep tinh offline).
      #
      # Tro vao minio-gateway (cong 9000 tren may that) chu KHONG vao MinIO
      # truc tiep - di thang thi khong qua lop bop toc do.
      Storage__Providers__home__Endpoint: http://localhost:9000
      Storage__Providers__home__AccessKey: *minioak
      Storage__Providers__home__SecretKey: *miniosk

  spamtracking:
    <<: *service
    build: ./SpamTrackingService/src/SpamTrackingService.Api
    ports: ["5160:8080"]
    environment:
      ConnectionStrings__SpamTrackingDb: "Host=host.docker.internal;Port=5435;Database=spamtracking;Username=spamtracking_admin;Password=${SPAMTRACKING_DB_PASSWORD}"
      ConnectionStrings__Redis: *redis
      Kafka__BootstrapServers: *kafka
      RabbitMq__HostName: host.docker.internal
      Jwt__SigningKey: *jwt
      RabbitMq__Password: *rabbitpw
      IdentityClient__BaseUrl: http://identity:8080

  media:
    <<: *service
    build: ./MediaService/src/MediaService.Api
    ports: ["5300:8080"]
    environment:
      ConnectionStrings__MediaDb: "Host=host.docker.internal;Port=5436;Database=media;Username=media_admin;Password=${MEDIA_DB_PASSWORD}"
      ConnectionStrings__MiniAppDb: "Host=host.docker.internal;Port=5437;Database=miniapp;Username=miniapp_admin;Password=${MINIAPP_DB_PASSWORD}"
      ConnectionStrings__Redis: *redis
      RabbitMq__HostName: host.docker.internal
      Jwt__SigningKey: *jwt
      RabbitMq__Password: *rabbitpw
      IdentityClient__BaseUrl: http://identity:8080
      ChatServiceClient__BaseUrl: http://chat:8080
      # ServerUrl: Media Service goi Server API -> dia chi tu trong container.
      # ClientUrl: tra ve cho TRINH DUYET tu ket noi -> dia chi tu may that.
      # Hai cai nay KHAC NHAU, doi nham la phong hop khong vao duoc.
      #
      # Mac dinh la LiveKit chay noi bo (kind-livekit-cluster). Muon dung
      # LiveKit Cloud thi tao file .env o thu muc goc va dien 4 gia tri -
      # KHONG sua thang vao day, vi file nay duoc git theo doi, secret se bi
      # commit len repo. Xem .env.example.
      LiveKit__ServerUrl: ${LIVEKIT_SERVER_URL:-http://host.docker.internal:7880}
      LiveKit__ClientUrl: ${LIVEKIT_CLIENT_URL:-ws://localhost:7880}
      LiveKit__ApiKey: ${LIVEKIT_API_KEY:-devkey_1e01d3e9a13a}
      LiveKit__ApiSecret: ${LIVEKIT_API_SECRET:-cdbb2977cd95310f859cd9eeedc9d4233ec2959ce1300f44}

  admin:
    <<: *service
    build: ./AdminService/src/AdminService.Api
    ports: ["5230:8080"]
    depends_on:
      kubeconfig-init:
        condition: service_completed_successfully
    volumes:
      # Gan vao DUNG duong dan mac dinh cua client K8s. Bien moi truong
      # KUBECONFIG khong an: KubernetesClientConfiguration.BuildConfigFromConfigFile()
      # (khong tham so) doc thang $HOME/.kube/config, bo qua KUBECONFIG -
      # da xac nhan bang loi that "kubeconfig file not found at
      # /home/appuser/.kube/config". appuser la user trong Dockerfile (uid 1000).
      - kubeconfig:/home/appuser/.kube:ro
    environment:
      RabbitMq__HostName: host.docker.internal
      Jwt__SigningKey: *jwt
      RabbitMq__Password: *rabbitpw
      IdentityClient__BaseUrl: http://identity:8080
      SpamTrackingClient__BaseUrl: http://spamtracking:8080
      ChatServiceClient__BaseUrl: http://chat:8080
      # Chay trong Docker chu khong trong K8s -> phai doc kubeconfig, khong
      # dung duoc InClusterConfig. File duoc kubeconfig-init sinh ra.
      K8s__UseInCluster: "false"

  # Kubeconfig cua Docker Desktop tro toi https://127.0.0.1:<cong-ngau-nhien>,
  # ma cong do DOI moi lan Docker Desktop khoi dong lai, va 127.0.0.1 trong
  # container la chinh container. Job nay chay truoc admin moi lan `up`, chep
  # lai kubeconfig va sua dia chi -> tu bat kip cong moi, khong phai sua tay.
  # Bo certificate-authority-data va bat insecure-skip-tls-verify vi cert cua
  # API server khong ky cho ten "host.docker.internal" (chi cho localhost/IP).
  kubeconfig-init:
    image: alpine:3.20
    networks: [app]
    volumes:
      - ~/.kube:/src:ro
      - kubeconfig:/kube
    command:
      - sh
      - -c
      - |
        if [ -f /src/config ]; then
          sed -e 's|https://127.0.0.1:|https://host.docker.internal:|g' \
              -e '/certificate-authority-data:/d' \
              -e 's|^\( *\)server: \(.*\)$$|\1server: \2\n\1insecure-skip-tls-verify: true|' \
              /src/config > /kube/config
          echo "kubeconfig san sang cho container"
        else
          echo "KHONG thay ~/.kube/config - /admin/system/resources se loi, phan con lai van chay"
          : > /kube/config
        fi

  # Cong vao MinIO co bop toc do (4 MB/s moi ket noi). Trinh duyet noi
  # chuyen voi cong nay chu khong voi MinIO truc tiep - xem
  # Tainguyen/infra/minio-gateway.conf.
  # MINIO_UPSTREAM tro toi MinIO that; doi bien nay khi MinIO doi cho.
  minio-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [app]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["9000:9000"]
    environment:
      MINIO_UPSTREAM: "192.168.50.10:9000"
    volumes:
      - ./Tainguyen/infra/minio-gateway.conf:/etc/nginx/nginx.conf.tpl:ro
    command:
      - sh
      - -c
      - |
        sed "s|MINIO_UPSTREAM|$$MINIO_UPSTREAM|" /etc/nginx/nginx.conf.tpl > /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    healthcheck:
      # 127.0.0.1 chu KHONG phai "localhost": busybox wget phan giai
      # localhost ra ::1 (IPv6) truoc, ma nginx chi nghe IPv4 -> healthcheck
      # bao "connection refused" trong khi gateway van chay hoan toan binh thuong.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: node:22-alpine
    working_dir: /app
    networks: [app]
    ports: ["5173:5173"]
    volumes:
      - ./Frontend:/app
      # Volume rieng cho node_modules: bind mount tu Windows sang Linux
      # container lam npm cham va de hong symlink.
      - frontend_node_modules:/app/node_modules
    environment:
      # Bind mount tu Windows khong ban su kien inotify -> Vite khong tu
      # reload neu khong bat polling.
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  kubeconfig:
  frontend_node_modules:
