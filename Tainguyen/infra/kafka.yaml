# Kafka KRaft mode (khong can Zookeeper), single-node cho dev/home-lab.
# Image chinh thuc Apache Kafka (apache/kafka), khong phai Bitnami.
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            # 172.18.0.7 = IP cua container node messaging-cluster-control-plane
            # tren docker network "kind" - dung de pod o cluster KHAC (docker-desktop,
            # kind-livekit-cluster) ket noi vao duoc, vi day la 3 cluster tach biet
            # khong chung K8s DNS noi bo. Neu container node bi tao lai (kind delete +
            # create), IP nay co the doi - kiem tra lai bang:
            #   docker network inspect kind
            #
            # QUAN TRONG: dung NodePort (30909), KHONG dung cong noi bo (9092).
            # Client (ke ca client chay ben trong chinh pod nay) nhan dia chi quang
            # ba nay roi MO KET NOI MOI toi dia chi do - neu quang ba cong 9092 thi
            # ket noi se that bai vi 9092 khong duoc bind ra ngoai container (chi co
            # NodePort 30909 duoc kube-proxy forward vao pod:9092).
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://172.18.0.2:30909"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512M -Xms256M"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kafka-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: kafka
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
spec:
  type: NodePort
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
      nodePort: 30909
