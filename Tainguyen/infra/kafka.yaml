# Kafka KRaft mode (khong can Zookeeper), single-node cho dev/home-lab.
# Image chinh thuc Apache Kafka (apache/kafka), khong phai Bitnami.
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            # QUAN TRONG - co che quang ba cua Kafka: client ket noi vao dia chi
            # bootstrap, nhan ve dia chi QUANG BA nay, roi MO KET NOI MOI toi do.
            # Nghia la dia chi quang ba phai dung voi MOI client, khong chi voi
            # client dau tien.
            #
            # Dung "host.docker.internal:9092" vi day la dia chi DUY NHAT ma ca ba
            # phia deu toi duoc:
            #   - container tren docker network "kind"  -> Docker Desktop tu cap
            #   - tien trinh chay thang tren Windows     -> co trong hosts file
            #   - pod o cluster khac (docker-desktop, livekit)
            # 9092 la hostPort da map san toi NodePort 30909 (kind-messaging-cluster.yaml).
            #
            # KHONG dung IP kieu 172.18.0.x cua container node: kind cap lai IP moi
            # khi delete+create cluster, va thu tu khoi dong doi thi IP doi theo -
            # da tung tro sai node that (172.18.0.2 = desktop-control-plane chu khong
            # phai messaging-cluster-control-plane), lam client trong container khong
            # produce duoc du bootstrap van thanh cong.
            # KHONG dung "127.0.0.1:19092" (dia chi cua kubectl port-forward): trong
            # container 127.0.0.1 la chinh container do.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://host.docker.internal:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512M -Xms256M"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kafka-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: kafka
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
spec:
  type: NodePort
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
      nodePort: 30909
