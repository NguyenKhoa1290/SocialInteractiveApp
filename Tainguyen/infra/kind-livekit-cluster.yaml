kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: livekit-cluster
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30880
        hostPort: 7880
        protocol: TCP
      - containerPort: 30881
        hostPort: 7881
        protocol: TCP
      - containerPort: 30882
        hostPort: 7882
        protocol: UDP
      - containerPort: 30478
        hostPort: 3478
        protocol: UDP
