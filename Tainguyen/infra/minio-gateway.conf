# Cong vao MinIO co bop toc do (file nginx.conf DAY DU, mount vao
# /etc/nginx/nginx.conf).
#
# Trinh duyet PUT/GET thang vao day bang presigned URL, KHONG di qua Chat
# Service - nen day la cho duy nhat chan duoc bang thong. Bop trong service
# .NET la vo nghia vi bytes khong bao gio di qua no (presign chi la phep
# tinh HMAC offline, da xac nhan bang test).
#
# QUAN TRONG ve chu ky S3: SigV4 ky ca header Host. Presigned URL duoc sinh
# cho dia chi CUA NGINX, nen nginx phai chuyen NGUYEN Host xuong MinIO -
# doi thanh "minio:9000" la chu ky sai, MinIO tra 403 SignatureDoesNotMatch.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log off;

    # MINIO_UPSTREAM duoc thay luc khoi dong (xem lenh trong docker-compose.yml)
    upstream minio_upstream {
        server MINIO_UPSTREAM;
    }

    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $server_name        zone=perserver:10m;

    server {
        listen 9000;
        server_name _;

        # File lon: khong chan kich thuoc, va KHONG buffer ca file vao dia
        # truoc khi day di. Mac dinh nginx nuot het request body xuong dia
        # roi moi forward - voi file 1GB nghia la ghi thua 1GB, va nguoi
        # dung thay "upload xong" trong khi MinIO chua nhan duoc gi.
        client_max_body_size 0;

        # Hai directive KHAC NHAU, va phai dat nguoc nhau:
        #  - proxy_request_buffering off : chieu LEN khong buffer, stream
        #    thang len MinIO. Bat len thi nginx nuot ca file 1GB xuong dia
        #    truoc roi moi day di.
        #  - proxy_buffering ON (mac dinh)  : chieu VE PHAI buffer, vi
        #    limit_rate chi hoat dong khi nginx co giu du lieu lai. Tat di
        #    thi nginx relay thang va limit_rate BI BO QUA - da do that:
        #    tat buffering do duoc 26 MB/s, bat len con dung 4 MB/s.
        proxy_request_buffering off;
        proxy_http_version 1.1;

        # Truyen file lon o toc do bi bop => rat lau. Timeout mac dinh 60s
        # se cat ngang giua chung.
        proxy_connect_timeout 30s;
        proxy_send_timeout 6h;
        proxy_read_timeout 6h;

        location / {
            # ---- Toi da 4 MB/s ----
            # limit_rate chi bop CHIEU TAI VE (response). Do dung la chieu
            # dang lo: nguoi khac tai file ve = tieu bang thong UPLOAD cua
            # duong truyen nha, von la thu khan hiem nhat. Chieu day len
            # (request body) nginx KHONG bop duoc - can `tc` o tang mang.
            limit_rate 4m;

            # 1 MB dau khong bop, de anh nho/thumbnail hien ngay lap tuc
            # thay vi cung cham nhu file lon.
            limit_rate_after 1m;

            # limit_rate la gioi han MOI KET NOI. 10 ket noi song song van
            # ngon 40 MB/s - limit_conn chan tran tong lai.
            limit_conn perip 4;
            limit_conn perserver 12;

            proxy_pass http://minio_upstream;

            # PHAI la $http_host, KHONG duoc dung $host: $host CAT MAT CONG
            # ("localhost:9000" -> "localhost"). SigV4 ky header Host nguyen
            # van ke ca cong, nen mat cong la chu ky sai va MinIO tra 403
            # SignatureDoesNotMatch. Da dinh that: gui thang toi MinIO voi
            # Host "localhost:9000" thi 200, qua nginx dung $host thi 403.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
