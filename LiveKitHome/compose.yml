services:
  livekit:
    image: livekit/livekit-server:v1.9.12@sha256:2c13cbf2edcbf13ea7b20d05c10b394d04d8fb3fe358269cff845a90b4de9576
    container_name: callimeet-home-livekit
    network_mode: host
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.template.yaml:/etc/livekit.yaml:ro
    logging:
      options: { max-size: "10m", max-file: "3" }
  proxy:
    build: .
    container_name: callimeet-home-proxy
    network_mode: host
    restart: unless-stopped
    depends_on: [livekit]
    environment:
      SFU_MEDIA_HOST: "127.0.0.1"
      ROTATION_SECONDS: ${ROTATION_SECONDS:-3000}
    tmpfs: [/root/.config]
    logging:
      options: { max-size: "10m", max-file: "3" }
