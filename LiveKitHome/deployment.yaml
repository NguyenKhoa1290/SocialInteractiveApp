apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-home-proxy
  namespace: chat-app
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: livekit-home-proxy}
  template:
    metadata:
      labels: {app: livekit-home-proxy}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 120
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.9.12@sha256:2c13cbf2edcbf13ea7b20d05c10b394d04d8fb3fe358269cff845a90b4de9576
          args: ["--config", "/etc/livekit.yaml"]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 2Gi}
          readinessProbe:
            tcpSocket: {port: 7880}
            periodSeconds: 5
          volumeMounts:
            - {name: livekit-config, mountPath: /etc/livekit.yaml, readOnly: true}
        - name: proxy
          image: ghcr.io/nguyenkhoa1290/chat-app-livekit-home-proxy:latest
          imagePullPolicy: Always
          env:
            - {name: PINGGY_BIN, value: /pinggy}
            # LiveKit binds UDP to the LAN interface, not to loopback.
            - {name: SFU_MEDIA_HOST, value: "192.168.101.18"}
            - {name: ROTATION_SECONDS, value: "3000"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 768Mi}
          startupProbe:
            httpGet: {host: "127.0.0.1", path: /health, port: 7883}
            periodSeconds: 5
            failureThreshold: 48
          readinessProbe:
            httpGet: {host: "127.0.0.1", path: /health, port: 7883}
            periodSeconds: 10
          volumeMounts:
            - {name: pinggy-binary, mountPath: /pinggy, readOnly: true}
            - {name: pinggy-data, mountPath: /root/.config}
      volumes:
        - name: livekit-config
          hostPath: {path: /home/nguyenkhoa/callimeet-home/livekit.yaml, type: File}
        - name: pinggy-binary
          hostPath: {path: /home/nguyenkhoa/callimeet-home/bin/pinggy, type: File}
        - name: pinggy-data
          hostPath: {path: /home/nguyenkhoa/callimeet-home/k8s-pinggy-data, type: DirectoryOrCreate}
