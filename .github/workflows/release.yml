# Build 7 image tren runner cua GitHub roi day len GHCR.
#
# VI SAO KHONG deploy thang tu day: server nha nam sau CGNAT, runner cua
# GitHub khong ket noi vao duoc. Nen day la mo hinh KEO: Actions chi day
# image len registry, con cum k3s tu kiem tra va cap nhat (xem
# Tainguyen/infra/k8s/image-watcher.yaml).
#
# Khong can khai bao secret nao: GITHUB_TOKEN co san quyen ghi package khi
# duoc cap `packages: write` ben duoi.
name: Build & Push images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: chat-app-identity,     context: IdentityService/src/IdentityService.Api }
          - { image: chat-app-workspace,    context: WorkspaceService/src/WorkspaceService.Api }
          - { image: chat-app-chat,         context: ChatService/src/ChatService.Api }
          - { image: chat-app-spamtracking, context: SpamTrackingService/src/SpamTrackingService.Api }
          - { image: chat-app-media,        context: MediaService/src/MediaService.Api }
          - { image: chat-app-admin,        context: AdminService/src/AdminService.Api }
          - { image: chat-app-frontend,     context: Frontend }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tinh ten image (GHCR bat buoc chu thuong)
        id: meta
        run: echo "repo=$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"

      # Frontend nhung URL API vao bundle LUC BUILD (Vite), khong doc luc
      # chay -> phai truyen dia chi server vao day. Doi dia chi server nghia
      # la phai build lai image, khong sua bien moi truong duoc.
      - name: Chuan bi build-arg cho frontend
        id: args
        if: matrix.image == 'chat-app-frontend'
        run: |
          H='${{ vars.PUBLIC_HOST }}'
          [ -z "$H" ] && H='192.168.101.18'
          {
            echo 'value<<EOF'
            echo "VITE_IDENTITY_API_URL=http://$H:5194"
            echo "VITE_WORKSPACE_API_URL=http://$H:5153"
            echo "VITE_CHAT_API_URL=http://$H:5261"
            echo "VITE_MEDIA_API_URL=http://$H:5300"
            echo "VITE_ADMIN_API_URL=http://$H:5230"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ steps.args.outputs.value }}
          # Hai the: SHA de biet chinh xac ban nao dang chay va de quay lui;
          # latest de image-watcher ben k3s theo doi.
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/${{ matrix.image }}:latest
          # Cache layer qua GitHub Actions cache - lan build sau chi dung lai
          # lop da co, khong keo lai toan bo image nen.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
