<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Bieu tuong app. `?v=` la CAN GAT PHA CACHE, khong phai trang tri:
         Cloudflare cache tep tinh o bien 4 tieng (da do: cf-cache-status HIT,
         max-age=14400), nen sua tep tai cho thi nguoi dung van thay bieu tuong
         cu ca buoi. Doi bieu tuong -> tang so nay len mot. -->
    <link rel="icon" type="image/svg+xml" href="/calli-icon.svg?v=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calli</title>
    <meta
      name="description"
      content="Calli — nhắn tin, tạo nhóm và tham gia cuộc họp trực tuyến trên máy tính lẫn điện thoại."
    />
    <meta name="theme-color" content="#2f3c52" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Calli" />
    <meta property="og:title" content="Calli" />
    <meta
      property="og:description"
      content="Nhắn tin, tạo nhóm và tham gia cuộc họp trực tuyến trên máy tính lẫn điện thoại."
    />
    <meta property="og:url" content="https://callimeet.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Calli" />
    <meta
      name="twitter:description"
      content="Nhắn tin, tạo nhóm và tham gia cuộc họp trực tuyến trên máy tính lẫn điện thoại."
    />

    <!-- Inter: kieu chu duy nhat trong ban thiet ke.
         Dat o day chu khong dung @import trong CSS - @import bat trinh duyet
         tai xong file CSS roi moi biet con phai di lay font, tuc la them mot
         luot khu hoi. Cap the <link> o <head> thi hai viec chay song song.
         preconnect mo san ket noi toi hai ten mien cua Google Fonts (mot cho
         file CSS, mot cho file font) truoc khi thuc su can. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
