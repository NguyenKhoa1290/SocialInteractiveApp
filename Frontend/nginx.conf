server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # HTML phai luon duoc tai lai sau moi lan deploy. Neu cache index.html,
    # bundle cu se tiep tuc tro toi dynamic chunk mang hash da bi thay the.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Asset co hash trong ten nen co the cache lau. Khong fallback asset thieu
    # ve index.html: module JavaScript ma nhan HTML 200 se tao loi kho hieu va
    # con co nguy co bi Cloudflare cache nham trong nhieu gio.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri @asset_not_found;
    }

    # Khong cache phan hoi 404: o lan deploy tiep theo cung URL do co the ton
    # tai, va Cloudflare khong duoc phep giu mot loi cu hang gio.
    location @asset_not_found {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # SPA: chi cac duong dan ung dung moi fallback ve index.html, de React
    # Router xu ly khi F5 o /admin/users, /app/chat/... v.v.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
